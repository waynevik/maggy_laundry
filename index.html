<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Laundry Management System</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="wrapper" aria-hidden="true">
    <div><span class="dot"></span></div>
    <div><span class="dot"></span></div>
    <div><span class="dot"></span></div>
    <div><span class="dot"></span></div>
    <div><span class="dot"></span></div>
    <div><span class="dot"></span></div>
    <div><span class="dot"></span></div>
    <div><span class="dot"></span></div>
    <div><span class="dot"></span></div>
    <div><span class="dot"></span></div>
    <div><span class="dot"></span></div>
    <div><span class="dot"></span></div>
    <div><span class="dot"></span></div>
    <div><span class="dot"></span></div>
    <div><span class="dot"></span></div>
  </div>

  <div class="container" id="signin">
    <h1 class="form-title">Sign In</h1>

    <div class="message error" id="loginMessage" hidden></div>

    <form id="loginForm" autocomplete="on">
      <div class="input-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="8" r="3.2"></circle>
          <path d="M5 19c1.4-3 3.8-4.5 7-4.5S17.6 16 19 19"></path>
        </svg>
        <input
          type="text"
          name="username"
          id="signin-username"
          placeholder="Username"
          autocomplete="username"
          required
        >
        <label for="signin-username">Username</label>
      </div>

      <div class="input-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="6" y="11" width="12" height="9" rx="1.5"></rect>
          <path d="M8.5 11V8.5a3.5 3.5 0 0 1 7 0V11"></path>
        </svg>
        <input
          type="password"
          name="password"
          id="signin-password"
          placeholder="Password"
          autocomplete="current-password"
          required
        >
        <label for="signin-password">Password</label>
      </div>

      <button type="submit" id="loginButton" class="button">Sign In</button>
    </form>

    <div class="links">
      <p>Don't have an account?</p>
      <button type="button" id="signUpButton">Sign Up</button>
    </div>

    <p class="demo-note">
      Admin: admin / admin123<br>
      Staff: staff / staff123
      <br>
      <button type="button" id="resetDemo">Reset demo data</button>
    </p>
  </div>

  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
